<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;overflow:hidden;background:#F4F4F0;color:#121417;font-family:'Archivo',sans-serif}
.top{padding:52px 20px 14px}
.top h1{font-size:28px;font-weight:800}
.board{margin:0 16px;background:#121417;color:#fff;border-radius:10px;padding:6px 0}
.bh{display:grid;grid-template-columns:62px 1fr 92px;padding:8px 14px;font-size:11px;font-weight:700;color:#8C9099}
.r{display:grid;grid-template-columns:62px 1fr 92px;align-items:center;padding:13px 14px;border-top:1px solid #2A2E35;font-size:15px}
.t{font-family:'JetBrains Mono',monospace;font-weight:700}
.s{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;text-align:right}
.now .s{color:#121417;background:#FFD400;padding:4px 6px;border-radius:3px}
.now{background:#1C2027}
.sub{color:#8C9099;font-size:12px;display:block}
.pass{margin:16px 16px 0;background:#fff;border-radius:10px;display:flex;overflow:hidden;border:1px solid #DDDDD6}
.pass .m{flex:1;padding:16px}
.pass .k{font-size:12px;font-weight:700;color:#6A6E76}
.pass .n{font-size:56px;font-weight:800;line-height:1}
.pass .stub{width:110px;border-left:2px dashed #DDDDD6;padding:16px;display:flex;flex-direction:column;justify-content:space-between}
.btn{background:#121417;color:#fff;border-radius:8px;padding:12px;text-align:center;font-weight:800}
.tabs{position:absolute;bottom:0;left:0;right:0;height:82px;border-top:1px solid #DDDDD6;background:#fff;display:flex;justify-content:space-around;padding-top:12px;font-size:12px;font-weight:700}
.dot{display:block;width:22px;height:22px;border-radius:6px;background:#121417;margin:0 auto 4px}
</style></head><body>
<div class="top"><h1>Today</h1></div>
<div class="board">
  <div class="bh"><span>TIME</span><span>ITEM</span><span style="text-align:right">STATUS</span></div>
  <div class="r now"><span class="t">NOW</span><span>Reviews 23<span class="sub">Japanese</span></span><span class="s">BOARDING</span></div>
  <div class="r now"><span class="t">NOW</span><span>Page 582<span class="sub">Sabaq</span></span><span class="s">BOARDING</span></div>
  <div class="r"><span class="t">14:00</span><span>Reviews +8<span class="sub">Japanese</span></span><span class="s">ON TIME</span></div>
  <div class="r"><span class="t">05:00</span><span>Pages 578–581<span class="sub">Sabqi</span></span><span class="s">TOMORROW</span></div>
  <div class="r"><span class="t">05:00</span><span>Page 3<span class="sub">Manzil</span></span><span class="s">TOMORROW</span></div>
</div>
<div class="pass">
  <div class="m"><div class="k">LESSONS · LEVEL 4</div><div class="n">5</div><div class="k">radicals waiting</div></div>
  <div class="stub"><div class="k">STREAK</div><div class="t" style="font-size:26px">12d</div><div class="btn">Go</div></div>
</div>
<div class="tabs"><div><span class="dot"></span>Today</div><div><span class="dot"></span>Japanese</div><div><span class="dot"></span>Quran</div><div><span class="dot"></span>Settings</div></div>
</body></html>
